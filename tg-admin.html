<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T&G Content Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #A07C30;
  --gold-light: #C9A55A;
  --deep: #0F0D0C;
  --warm: #F0E8DC;
  --warm2: #E8DDD0;
  --muted: #5A5450;
  --border: #D8D0C4;
  --white: #FEFCF9;
  --navy: #3D5070;
  --success: #4A7C59;
  --danger: #8B3A3A;
  --sidebar-w: 260px;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: #F2EDE6;
  color: var(--deep);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--deep);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0; bottom: 0;
  z-index: 100;
  overflow-y: auto;
}

.sidebar-brand {
  padding: 28px 24px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.sidebar-brand-top {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.9);
}
.sidebar-brand-top .amp { color: var(--gold); font-style: italic; font-weight: 400; }
.sidebar-brand-rule {
  width: 100%; height: 1px;
  background: linear-gradient(to right, var(--gold), transparent);
  margin: 5px 0;
}
.sidebar-brand-sub {
  font-size: 8px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
}
.sidebar-label {
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.28);
  padding: 20px 24px 8px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 24px;
  font-size: 13px;
  font-weight: 400;
  color: rgba(255,255,255,0.55);
  cursor: pointer;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  transition: all 0.15s;
  border-left: 2px solid transparent;
  text-decoration: none;
}
.nav-item:hover { color: rgba(255,255,255,0.88); background: rgba(255,255,255,0.04); }
.nav-item.active { color: rgba(255,255,255,0.95); background: rgba(160,124,48,0.12); border-left-color: var(--gold); }
.nav-item-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }

.sidebar-footer {
  margin-top: auto;
  padding: 20px 24px;
  border-top: 1px solid rgba(255,255,255,0.07);
}
.sidebar-footer p { font-size: 11px; color: rgba(255,255,255,0.3); line-height: 1.6; }

/* ── MAIN ── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 16px 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: var(--deep); }
.topbar-title span { color: var(--gold); font-style: italic; }
.topbar-actions { display: flex; gap: 10px; align-items: center; }

.btn {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  padding: 9px 20px;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 2px;
}
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--gold); }
.btn-gold { background: var(--gold); color: #fff; }
.btn-gold:hover { background: #8a6820; }
.btn-outline { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-outline:hover { border-color: var(--gold); color: var(--gold); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(139,58,58,0.3); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-sm { padding: 6px 14px; font-size: 10px; }

/* ── CONTENT AREA ── */
.content { padding: 32px 36px; flex: 1; }

/* ── PANEL ── */
.panel {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 2px;
  margin-bottom: 20px;
}
.panel-header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.panel-title {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
.panel-body { padding: 24px; }

/* ── FORM ELEMENTS ── */
.field { margin-bottom: 20px; }
.field:last-child { margin-bottom: 0; }
.label {
  display: block;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--deep);
  font-weight: 500;
  margin-bottom: 7px;
}
.label-hint { font-size: 10px; color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }
.input, .textarea, .select {
  width: 100%;
  background: #F8F3EE;
  border: 1px solid var(--border);
  padding: 10px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--deep);
  outline: none;
  transition: border-color 0.2s;
  border-radius: 2px;
}
.input:focus, .textarea:focus, .select:focus { border-color: var(--gold); background: #fff; }
.textarea { min-height: 100px; resize: vertical; line-height: 1.7; }
.textarea-tall { min-height: 160px; }
.input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.input-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

/* ── SECTION TABS ── */
.section-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  background: var(--white);
  overflow-x: auto;
}
.section-tab {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 14px 22px;
  cursor: pointer;
  border: none;
  background: none;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  transition: all 0.15s;
}
.section-tab:hover { color: var(--deep); }
.section-tab.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 500; }

/* ── DASHBOARD ── */
.dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--white);
  border: 1px solid var(--border);
  padding: 22px 24px;
  border-radius: 2px;
}
.stat-card-label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.stat-card-value { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; color: var(--deep); line-height: 1; }
.stat-card-value span { font-size: 18px; color: var(--gold); }
.stat-card-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }

.page-list-item {
  display: flex;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  gap: 14px;
  cursor: pointer;
  transition: background 0.15s;
}
.page-list-item:last-child { border-bottom: none; }
.page-list-item:hover { background: #F8F3EE; }
.page-icon {
  width: 36px; height: 36px;
  border: 1px solid rgba(160,124,48,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  color: var(--gold);
}
.page-name { font-size: 14px; font-weight: 500; color: var(--deep); }
.page-file { font-size: 11px; color: var(--muted); margin-top: 2px; }
.page-arrow { margin-left: auto; color: var(--muted); font-size: 12px; }

/* ── TOAST ── */
.toast-container { position: fixed; bottom: 28px; right: 28px; z-index: 999; display: flex; flex-direction: column; gap: 10px; }
.toast {
  background: var(--deep);
  color: rgba(255,255,255,0.88);
  padding: 13px 20px;
  font-size: 13px;
  border-left: 3px solid var(--gold);
  border-radius: 2px;
  min-width: 260px;
  animation: slideIn 0.3s ease;
  display: flex;
  align-items: center;
  gap: 10px;
}
.toast.success { border-left-color: #4A7C59; }
.toast.error { border-left-color: var(--danger); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ── AI ASSIST ── */
.ai-bar {
  background: linear-gradient(135deg, #1A1614 0%, #2A2420 100%);
  border: 1px solid rgba(160,124,48,0.2);
  padding: 16px 20px;
  display: flex;
  gap: 12px;
  align-items: flex-end;
  margin-bottom: 20px;
  border-radius: 2px;
}
.ai-bar-label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.ai-input {
  flex: 1;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  padding: 10px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: rgba(255,255,255,0.88);
  outline: none;
  border-radius: 2px;
  width: 100%;
}
.ai-input:focus { border-color: var(--gold); }
.ai-input::placeholder { color: rgba(255,255,255,0.3); }
.ai-btn {
  background: var(--gold);
  color: #fff;
  border: none;
  padding: 10px 18px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
  border-radius: 2px;
  transition: background 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ai-btn:hover { background: #8a6820; }
.ai-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.ai-spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── PREVIEW PANE ── */
.preview-frame {
  border: 1px solid var(--border);
  border-radius: 2px;
  background: var(--white);
  overflow: hidden;
}
.preview-bar {
  background: #F2EDE6;
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.preview-dot { width: 10px; height: 10px; border-radius: 50%; }
.preview-url {
  flex: 1;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px 12px;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
}

/* ── SECTION EDITOR ── */
.section-block {
  border: 1px solid var(--border);
  border-radius: 2px;
  margin-bottom: 12px;
  background: var(--white);
  transition: border-color 0.2s;
}
.section-block:hover { border-color: rgba(160,124,48,0.4); }
.section-block-header {
  display: flex;
  align-items: center;
  padding: 13px 18px;
  gap: 12px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}
.section-block.open .section-block-header { border-bottom-color: var(--border); }
.section-block-handle { color: var(--muted); font-size: 13px; cursor: grab; }
.section-block-type { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); background: rgba(160,124,48,0.08); padding: 3px 8px; border-radius: 2px; }
.section-block-title { font-size: 13px; font-weight: 500; color: var(--deep); flex: 1; }
.section-block-toggle { color: var(--muted); font-size: 11px; transition: transform 0.2s; }
.section-block.open .section-block-toggle { transform: rotate(180deg); }
.section-block-body { padding: 20px; display: none; }
.section-block.open .section-block-body { display: block; }

/* ── FIELD GROUPS ── */
.field-group {
  background: #F8F3EE;
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 16px;
  margin-bottom: 12px;
}
.field-group-label {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ── SAVED INDICATOR ── */
.save-status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
.save-dot.saved { background: #4A7C59; }
.save-dot.unsaved { background: #C08A30; }

/* ── MOBILE SIDEBAR TOGGLE ── */
.sidebar-toggle { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 200; background: var(--deep); color: #fff; border: none; width: 48px; height: 48px; border-radius: 50%; font-size: 18px; cursor: pointer; }

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .dash-grid { grid-template-columns: 1fr 1fr; }
  .input-row, .input-row-3 { grid-template-columns: 1fr; }
  .sidebar-toggle { display: flex; align-items: center; justify-content: center; }
  .content { padding: 20px 18px; }
  .topbar { padding: 14px 18px; }
}
</style>
</head>

// ─── FIELD HELPERS ────────────────────────────────────────────────────────────
function field(label, page, key, hint='', type='input') {
  const val = (state[page][key] || '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const hintHtml = hint ? `<span class="label-hint">${hint}</span>` : '';
  if (type === 'input') {
    return `<div class="field"><label class="label">${label}${hintHtml}</label><input class="input" value="${val}" oninput="update('${page}','${key}',this.value)"></div>`;
  }
  const cls = type.includes('tall') ? 'textarea textarea-tall' : 'textarea';
  return `<div class="field"><label class="label">${label}${hintHtml}</label><textarea class="${cls}" oninput="update('${page}','${key}',this.value)">${val}</textarea></div>`;
}

function miniField(label, page, key) {
  const val = (state[page][key] || '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  return `<div class="field"><label class="label">${label}</label><input class="input" value="${val}" oninput="update('${page}','${key}',this.value)"></div>`;
}

// ─── CORE FUNCTIONS ───────────────────────────────────────────────────────────
function update(page, key, value) {
  state[page][key] = value;
  markUnsaved();
}

function showView(name) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const btn = [...document.querySelectorAll('.nav-item')].find(el => el.textContent.trim().toLowerCase().includes(name === 'homepage' ? 'home' : name === 'global' ? 'global' : name));
  if (btn) btn.classList.add('active');
  const titles = { dashboard:'Dashboard', homepage:'Homepage', about:'About', aesthetics:'Aesthetics', services:'Services', specials:'Specials', downloads:'Downloads', contact:'Contact', global:'Global Settings' };
  const subtitles = { dashboard:'Overview', homepage:'Edit Content', about:'Edit Content', aesthetics:'Edit Content', services:'Edit Content', specials:'Edit Content', downloads:'Edit Content', contact:'Edit Content', global:'Site-wide Settings' };
  document.getElementById('topbarTitle').innerHTML = `${titles[name]} <span>${subtitles[name]}</span>`;
  document.getElementById('contentArea').innerHTML = views[name]();
  window.scrollTo(0,0);
}

function switchTab(el, tabId) {
  el.closest('.section-tabs').querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const panel = el.closest('.main').querySelector('.content');
  panel.querySelectorAll('[id^="homeTab"]').forEach(t => t.style.display = 'none');
  const target = document.getElementById(tabId);
  if (target) target.style.display = '';
}

function savePage(page) {
  saveState();
  toast(`${page.charAt(0).toUpperCase()+page.slice(1)} saved ✓`, 'success');
}

function saveGlobal() {
  saveState();
  toast('Global settings saved — will apply on next export ✓', 'success');
}

// ─── AI ASSIST ────────────────────────────────────────────────────────────────
async function runAI() {
  const inputEl = document.getElementById('aiInput');
  const btnEl = document.getElementById('aiBtn');
  const btnText = document.getElementById('aiBtnText');
  const prompt = inputEl.value.trim();
  if (!prompt) { toast('Please describe what you\'d like help with', 'error'); return; }

  btnEl.disabled = true;
  btnText.innerHTML = '<span class="ai-spinner"></span> Writing…';

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `You are a professional copywriter for Turner & Goldrich, a prestigious London dental laboratory founded in 1973. 
The lab specialises in crown and bridge work, PFM, IPS e.max, and Zirconia restorations. 
Their tone is: refined, professional, warm, precise. Not overly salesy. 
When rewriting content, preserve all factual/technical information exactly. 
Return ONLY the rewritten text, no explanation or preamble.`,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await resp.json();
    const text = data.content?.find(b => b.type === 'text')?.text || '';
    if (!text) throw new Error('No response');
    showAIResult(text);
  } catch(e) {
    toast('AI assist failed — please try again', 'error');
  }

  btnEl.disabled = false;
  btnText.textContent = 'Generate';
}

function showAIResult(text) {
  // Remove any existing result
  document.querySelectorAll('.ai-result').forEach(el => el.remove());
  const div = document.createElement('div');
  div.className = 'ai-result';
  div.style.cssText = 'background:#1A1614;border:1px solid rgba(160,124,48,0.3);padding:20px;margin-bottom:20px;border-radius:2px;';
  div.innerHTML = `
    <div style="font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;">✦ AI Suggestion — Review and copy where needed</div>
    <p style="font-size:14px;line-height:1.8;color:rgba(255,255,255,0.82);white-space:pre-wrap;">${text}</p>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button onclick="navigator.clipboard.writeText(\`${text.replace(/`/g,'\\`')}\`);toast('Copied to clipboard','success')" style="background:var(--gold);color:#fff;border:none;padding:8px 16px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;border-radius:2px;">Copy Text</button>
      <button onclick="this.closest('.ai-result').remove()" style="background:transparent;color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.1);padding:8px 16px;font-size:11px;cursor:pointer;border-radius:2px;">Dismiss</button>
    </div>`;
  const aiBar = document.querySelector('.ai-bar');
  aiBar.insertAdjacentElement('afterend', div);
}

// ─── EXPORT ───────────────────────────────────────────────────────────────────
function exportAll() {
  // Build a JSON summary of all changes for the user
  const summary = JSON.stringify(state, null, 2);
  const blob = new Blob([`// Turner & Goldrich CMS Export
// Generated: ${new Date().toLocaleString()}
// 
// HOW TO USE:
// This file contains all your edited content.
// Send this file to your developer to apply the changes to your HTML files.
// Or use the individual page exports below.
//
// YOUR CONTENT:
${summary}`], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tg-content-export.json';
  a.click();
  URL.revokeObjectURL(url);

  // Also build and download the about page as a demonstration
  generateAndDownload();
  toast('Content exported! Send tg-content-export.json to your developer ✓', 'success');
}

function generateAndDownload() {
  // Build a simple text summary for each page
  const lines = [];
  lines.push('TURNER & GOLDRICH — CONTENT CHANGES SUMMARY');
  lines.push('='.repeat(50));
  lines.push('Generated: ' + new Date().toLocaleString());
  lines.push('');
  Object.entries(state).forEach(([page, fields]) => {
    lines.push(`\n── ${page.toUpperCase()} ──`);
    Object.entries(fields).forEach(([key, val]) => {
      lines.push(`${key}: ${val}`);
    });
  });
  const blob = new Blob([lines.join('\n')], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tg-content-summary.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function previewSite() {
  window.open('turnergoldrich-reimagined.html', '_blank');
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg, type='') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity 0.4s'; setTimeout(()=>el.remove(),400); }, 3000);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
showView('dashboard');

// Auto-save every 30 seconds
setInterval(() => { saveState(); }, 30000);
</script>
</body>
